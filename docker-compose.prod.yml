# =============================================================================
# SmartChat — production overlay (single Linux VPS, Docker Compose)
#
# Usage on the server:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml docker compose up -d
#
# Two properties this file is responsible for, and neither is optional:
#
#  1. **Only the edge is reachable.** No infrastructure port is published. The
#     base file publishes nothing either; the development overlay is what opens
#     ports, and it is not used here.
#  2. **Nothing runs with more privilege than it needs.** Every service drops
#     new-privilege escalation, and the ones that can run on a read-only root
#     filesystem do.
#
# See docs/DEPLOYMENT.md for the certificate and first-boot procedure.
# =============================================================================

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

services:
  postgres:
    <<: *hardening
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      # Slow queries are logged; every statement is not. A production log of every
      # SELECT is both a performance problem and a pile of personal data in a file
      # nobody has thought about who can read.
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_statement=none
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 768m

  minio:
    <<: *hardening

  api:
    <<: *hardening
    # A route to the host, for a mail server running there rather than in a container.
    #
    # `localhost` inside a container is the container. When SMTP_HOST is set to
    # host.docker.internal this is what makes that name resolve to the machine the
    # stack is running on - which is where Postfix lives when the deployment sends
    # its own mail. Harmless when mail goes to a third-party relay instead: the name
    # simply goes unused.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Production must never accept a webhook pointed at the private network, and
      # must never wave through a widget request from localhost.
      ALLOW_PRIVATE_WEBHOOK_URLS: 'false'
      ALLOW_LOCALHOST_ORIGINS: 'false'
      AUTO_VERIFY_EMAIL: 'false'
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g

  realtime:
    <<: *hardening
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g

  ai:
    <<: *hardening
    # The models take ~5 GB resident (chat + embeddings + context); the rest is headroom for the
    # prompt cache. Eight of the twelve cores: a reply then takes ~4 s, and Postgres, Redis and the
    # Node services keep four for themselves under load.
    # Half the default CPU weight: when the box is busy, a model reply may wait a few milliseconds
    # longer, but the media server forwarding a live call must not (see livekit below).
    cpu_shares: 512
    deploy:
      resources:
        limits:
          memory: 7g
          cpus: '8'

  crawl4ai:
    <<: *hardening
    # A browser is a browser: Chromium plus crawl4ai's Python, capped so a heavy site cannot take
    # the box with it. Two pages at once is the concurrency the worker sends.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'

  worker:
    <<: *hardening
    # The worker is what actually sends every queued message, so it needs the same
    # route to the host's mail server as the API.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    <<: *hardening
    environment:
      NODE_ENV: production
      # Browser-facing addresses. These end up in the page, so they are the public
      # hostnames rather than the names on the private network.
      API_URL: https://${API_HOST:?API_HOST is required}
      REALTIME_URL: https://${WS_HOST:?WS_HOST is required}
      WIDGET_URL: https://${CDN_HOST:?CDN_HOST is required}
      # Server-rendered pages call the API from inside the network, where
      # localhost is this container rather than the API.
      INTERNAL_API_URL: http://api:3001
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its image cache here even in standalone mode.
      - /app/apps/web/.next/cache
    deploy:
      resources:
        limits:
          memory: 1g

  widget:
    <<: *hardening

  # ---------------------------------------------------------------------------
  # Voice calls. The media server publishes its media ports itself (see the base file); the
  # TURN-over-TLS leg comes in through the edge on 443 and is handed over on the private
  # network. The speech service gets four cores and the memory its models take; the agent is a
  # small Node process. Together with the AI container this is the CPU budget of the box, which
  # is why VOICE_AI_MAX_CALLS defaults to one.
  # ---------------------------------------------------------------------------
  livekit:
    <<: *hardening
    # Live audio is the one thing on this box that cannot wait. Two cores of headroom (a call
    # uses a few percent of one, but forwarding comes in bursts), the Go runtime told so (left
    # alone it starts a thread per host core, and a burst across twelve threads under a small
    # quota is throttled for the rest of the period - audible as jitter), and four times the
    # default CPU weight, so a busy model never delays a packet.
    environment:
      GOMAXPROCS: '2'
    cpu_shares: 4096
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'

  speech:
    <<: *hardening
    environment:
      SPEECH_THREADS: ${SPEECH_THREADS:-4}
    # A caller is listening while it works: twice the default weight, ahead of the model.
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          memory: 3500m
          cpus: '4'

  voice:
    <<: *hardening
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Sends the AI's voice in real time: twice the default weight, like the speech service.
    cpu_shares: 2048
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'

  # The acceptance harness - a fake customer website with the widget installed. It is
  # how the end-to-end suites exercise a real installation, and it has no business
  # running on a production server. A profile nothing activates here keeps it out of
  # `docker compose up` without removing it from the development stack.
  test-site:
    profiles: ['acceptance']

  # ---------------------------------------------------------------------------
  # The edge: the only container the internet can reach.
  # ---------------------------------------------------------------------------
  edge:
    <<: *hardening
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
      WS_HOST: ${WS_HOST:?WS_HOST is required}
      CDN_HOST: ${CDN_HOST:?CDN_HOST is required}
      # Substitute these four names and nothing else. The image's default is "every
      # variable that happens to be defined in this container's environment", which is
      # fine until one of them collides with an nginx runtime variable - $upstream_api
      # would be replaced with an empty string and the edge would proxy to nowhere.
      NGINX_ENVSUBST_FILTER: '^(APP|API|WS|CDN)_HOST$$'
    volumes:
      # Templated, so the hostnames come from the environment rather than from a
      # file somebody has to remember to edit. nginx substitutes them at start.
      - ./infrastructure/nginx/edge.conf:/etc/nginx/templates/edge.conf.template:ro
      # The main configuration is ours rather than the image's, for one reason: a `stream`
      # block. Port 443 is answered by it, and it hands TLS connections to the HTTP servers
      # below or - by the name the client asked for - to the media server's TURN listener.
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/stream.conf:/etc/nginx/templates/stream.conf.template:ro
      # TLS material lives OUTSIDE the repository. certbot writes it as root, and while it
      # sat in the working tree two things were true: `docker compose build` failed on every
      # deployed host, because BuildKit walks the context and cannot read certs/accounts
      # (mode 0700 root); and had it succeeded, every private key would have been copied into
      # every image layer. A git working tree is the wrong place for a private key.
      - ${CERT_DIR:-/opt/smartchat/tls/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_DIR:-/opt/smartchat/tls/acme}:/var/www/certbot
    # Proof that nginx is answering, which two earlier versions of this check were not.
    #
    # The first ended in `|| exit 0` and could never fail. The second asked for `/` and
    # matched the 301 to https - correct logic, but written with GNU wget's
    # `--max-redirect`, and this image ships BusyBox wget, which rejects the option and
    # exits non-zero every time. A container serving perfectly reported unhealthy.
    #
    # This asks for the ACME challenge directory instead: it is the one location on
    # port 80 that does not redirect, so there is nothing to follow. Any HTTP status
    # line back means nginx is up and its configuration loaded; 404 is the expected
    # answer when no challenge is in flight.
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qS --spider http://127.0.0.1/.well-known/acme-challenge/ 2>&1 | grep -qE 'HTTP/1\\.[01] (200|403|404)'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Certificates. Renews and exits; a timer or cron runs it, not a daemon that
  # sits idle for ninety days waiting to matter.
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    profiles: ['certs']
    volumes:
      - ${CERT_DIR:-/opt/smartchat/tls/letsencrypt}:/etc/letsencrypt
      - ${ACME_DIR:-/opt/smartchat/tls/acme}:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      --non-interactive --agree-tos --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
      -d ${APP_HOST} -d www.${APP_HOST} -d ${API_HOST} -d ${WS_HOST} -d ${CDN_HOST}
      ${CERT_EXTRA_ARGS:-}"
    networks: [smartchat]
