# =============================================================================
# SmartChat — base compose file (shared service definitions)
#
# This file is never used alone. Combine it with an environment overlay:
#   development : docker compose -f docker-compose.yml -f docker-compose.dev.yml ...
#   production  : docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# The COMPOSE_FILE variable in .env selects the overlay automatically, so a
# plain `docker compose up -d` does the right thing.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-smartchat}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — durable source of truth
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smartchat}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smartchat} -d ${POSTGRES_DB:-smartchat}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Redis — pub/sub, presence, rate limiting, queues, cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for attachments and avatars
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-smartchat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # One-shot: create the bucket and apply a private-by-default policy
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartchat}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-smartchat}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        mc mb --ignore-existing "local/$$S3_BUCKET-public"
        mc anonymous set download "local/$$S3_BUCKET-public"
        echo "minio-init: buckets ready"
    networks: [smartchat]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  smartchat:
    driver: bridge
