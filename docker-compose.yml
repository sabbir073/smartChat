# =============================================================================
# SmartChat — base compose file (shared service definitions)
#
# This file is never used alone. Combine it with an environment overlay:
#   development : docker compose -f docker-compose.yml -f docker-compose.dev.yml ...
#   production  : docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# The COMPOSE_FILE variable in .env selects the overlay automatically, so a
# plain `docker compose up -d` does the right thing.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-smartchat}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Configuration shared by every Node service. Values come from .env; nothing is hardcoded here,
# so the same file works in development and production.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_URL: ${API_URL:-http://localhost:3001}
  REALTIME_URL: ${REALTIME_URL:-http://localhost:3002}
  WIDGET_URL: ${WIDGET_URL:-http://localhost:3003}
  VISITOR_TOKEN_SECRET: ${VISITOR_TOKEN_SECRET:?VISITOR_TOKEN_SECRET is required}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9100}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-smartchat}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartchat}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@smartchat.local}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SmartChat}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  CORS_DASHBOARD_ORIGINS: ${CORS_DASHBOARD_ORIGINS:-http://localhost:3000}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL:-false}
  ALLOW_LOCALHOST_ORIGINS: ${ALLOW_LOCALHOST_ORIGINS:-true}
  # Development only. The production compose file does not set it, and it defaults to false.
  ALLOW_PRIVATE_WEBHOOK_URLS: ${ALLOW_PRIVATE_WEBHOOK_URLS:-false}
  # Optional. Absent means /metrics returns 404 and does not exist - opt-in, because an
  # unauthenticated metrics endpoint tells a stranger how many customers you have.
  METRICS_TOKEN: ${METRICS_TOKEN:-}

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — durable source of truth
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smartchat}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smartchat} -d ${POSTGRES_DB:-smartchat}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Redis — pub/sub, presence, rate limiting, queues, cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for attachments and avatars
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-smartchat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # One-shot: create the bucket and apply a private-by-default policy
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartchat}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-smartchat}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        mc mb --ignore-existing "local/$$S3_BUCKET-public"
        mc anonymous set download "local/$$S3_BUCKET-public"
        echo "minio-init: buckets ready"
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Database migrations. A one-shot service, run explicitly before the apps start.
  # Application containers never mutate the schema on boot: a rolling deploy would
  # otherwise have several replicas racing to migrate the same database.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP: api
    image: smartchat/api:${IMAGE_TAG:-local}
    restart: 'no'
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    working_dir: /app/packages/database
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # HTTP API - the only writer of business data.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP: api
    image: smartchat/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on: *infra-ready
    environment:
      <<: *app-env
      SERVICE_NAME: api
      PORT: 3001
      HOST: 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ready >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # WebSocket gateway. Holds connections, presence and typing state; delegates every
  # business rule to the same domain services the API uses, so both paths behave identically.
  # ---------------------------------------------------------------------------
  realtime:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP: realtime
    image: smartchat/realtime:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on: *infra-ready
    environment:
      <<: *app-env
      SERVICE_NAME: realtime
      PORT: 3002
      HOST: 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ready >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Background jobs: email, webhooks, triggers, analytics rollups, retention.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/node.Dockerfile
      args:
        APP: worker
    image: smartchat/worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on: *infra-ready
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HEALTH_PORT: 3005
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3005/ready >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Dashboard: agent workspace, account settings, and later the super-admin console.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: smartchat/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Browser-facing URLs. Rendered into the page at request time, so one image works in
      # every environment without a rebuild.
      API_URL: ${API_URL:-http://localhost:3001}
      REALTIME_URL: ${REALTIME_URL:-http://localhost:3002}
      WIDGET_URL: ${WIDGET_URL:-http://localhost:3003}
      # Server-rendered pages (the public help centre) call the API from inside the network,
      # where `localhost` is this container rather than the API.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3001}
      # Not used to reach storage - the browser does that over a signed URL. The dashboard needs
      # the origin so its Content Security Policy can allow the attachment images it renders.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9100}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # The embeddable surface: loader.js and the panel bundle, served by nginx.
  # Runtime URLs are substituted into the static files at container start, so one image
  # works in every environment.
  # ---------------------------------------------------------------------------
  widget:
    build:
      context: .
      dockerfile: infrastructure/docker/widget.Dockerfile
    image: smartchat/widget:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      API_URL: ${API_URL:-http://localhost:3001}
      REALTIME_URL: ${REALTIME_URL:-http://localhost:3002}
      # Named in the panel's Content Security Policy so a visitor can see the file they were
      # just sent. Nothing here reaches storage; the browser does, over a signed URL.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9100}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # A real customer website with the widget installed the way a customer installs it.
  # This is the acceptance harness for the whole system, not a mock.
  # ---------------------------------------------------------------------------
  test-site:
    build:
      context: .
      dockerfile: infrastructure/docker/test-site.Dockerfile
      args:
        WIDGET_URL: ${WIDGET_URL:-http://localhost:3003}
        TEST_SITE_PROPERTY_ID: ${TEST_SITE_PROPERTY_ID:-prp_DEMKTESTSTE00001}
    image: smartchat/test-site:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [smartchat]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  smartchat:
    driver: bridge
