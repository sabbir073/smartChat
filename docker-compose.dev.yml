# =============================================================================
# SmartChat — development overlay (Docker Desktop / localhost)
#
# Adds: host port publishing, Mailpit, source bind-mounts and hot reload.
# Combine with the base file (COMPOSE_FILE in .env does this for you).
# =============================================================================

services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=200

  redis:
    ports:
      - '${REDIS_PORT:-56379}:6379'

  minio:
    ports:
      - '${MINIO_API_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'

  # ---------------------------------------------------------------------------
  # Mailpit — captures every outbound email in development.
  # UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '5000'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    networks: [smartchat]

  # ---------------------------------------------------------------------------
  # Development: publish ports and run the TypeScript sources directly.
  #
  # Only each app's `src` directory is bind-mounted. Mounting the repository root would shadow
  # node_modules, and pnpm's symlinked layout does not survive that on Windows. Editing a shared
  # package therefore needs an image rebuild; editing an app does not.
  # ---------------------------------------------------------------------------
  api:
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # So a webhook can point at a test receiver running on this machine. Never in production.
      ALLOW_PRIVATE_WEBHOOK_URLS: 'true'
      # Windows bind mounts do not deliver inotify events, so the watcher has to poll.
      CHOKIDAR_USEPOLLING: '1'
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
    command: ['./node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']

  realtime:
    ports:
      - '${REALTIME_PORT:-3002}:3002'
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CHOKIDAR_USEPOLLING: '1'
    volumes:
      - ./apps/realtime/src:/app/apps/realtime/src:ro
    command: ['./node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']

  worker:
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CHOKIDAR_USEPOLLING: '1'
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
    command: ['./node_modules/.bin/tsx', 'watch', '--clear-screen=false', 'src/index.ts']

  web:
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production

  widget:
    ports:
      - '${WIDGET_PORT:-3003}:80'

  test-site:
    ports:
      - '${TEST_SITE_PORT:-3004}:80'
