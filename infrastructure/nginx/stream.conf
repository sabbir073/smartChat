# =============================================================================
# The stream front on port 443.
#
# Two kinds of connection arrive on 443. Almost all are HTTPS for the hostnames in edge.conf.
# The rest are TURN-over-TLS from a voice call on a network that blocks UDP and odd TCP ports:
# the media server advertises `turns:turn.<host>:443`, and that is the only port such a network
# lets through. The two are told apart by the name the client asks for in the TLS handshake
# (SNI), before any byte is decrypted; each is then passed on with a PROXY protocol header so the
# receiver still knows the client's real address.
#
# TURN connections are decrypted here, with the same certificate as everything else, and handed
# to the media server as plain TCP on the private network. The certificate therefore lives in
# one place, and a renewal needs no restart of the media server.
# =============================================================================

log_format stream_main '$remote_addr [$time_local] $ssl_preread_server_name -> $upstream_addr '
                       '$protocol $status $bytes_sent $bytes_received $session_time';
access_log /var/log/nginx/stream.log stream_main;

# The TURN hostname is "turn." in front of the site's own name. Matched by prefix so this file
# needs no substitution; nothing else legitimately starts with it.
map $ssl_preread_server_name $sc_front_upstream {
    ~^turn\.    127.0.0.1:5350;
    default     127.0.0.1:8443;
}

# nginx resolves an upstream name once at start; the media server may start after the edge, so
# its address is looked up through Docker's DNS when a connection actually arrives.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $sc_front_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
}

# TURN over TLS: terminate here, forward plain TCP with the client's address to the media server.
server {
    listen 127.0.0.1:5350 ssl proxy_protocol;
    # The connection comes from the front above, whose PROXY header carries the client. Trusting it
    # makes that the address passed on; without this the media server sees 127.0.0.1 for everyone.
    set_real_ip_from 127.0.0.1;
    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $upstream_turn livekit:5349;
    proxy_pass $upstream_turn;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    proxy_timeout 3600s;
}
