# =============================================================================
# SmartChat — the edge.
#
# The only container the internet can reach. Everything else in the compose file
# listens on the private network with no published port, so this file is the
# entire attack surface of the deployment.
#
# Four hostnames, one certificate each, and deliberately separate origins:
#
#   app.example.com     the dashboard and the public help centre
#   api.example.com     the HTTP API
#   ws.example.com      the realtime gateway
#   cdn.example.com     loader.js and the widget panel
#
# They are separate because the widget runs inside other people's pages. Serving
# it from the dashboard's origin would put customer-controlled content one
# same-origin bug away from a signed-in session.
# =============================================================================

# Rate limits, applied at the edge as well as in the application. The application's
# limiter knows about accounts and endpoints; this one knows nothing and is therefore
# still standing when the application is the thing being overwhelmed.
limit_req_zone $binary_remote_addr zone=api_general:16m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:8m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conns:16m;

# Trust only the proxy chain we control. Without this, X-Forwarded-For is whatever
# the client typed, and every per-IP limit in the application becomes decorative.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Re-resolve the application containers, rather than pinning them at startup.
#
# nginx resolves a hostname in `proxy_pass` once, when the configuration loads, and
# keeps that address for the life of the process. Compose gives a rebuilt container a
# new address, so every deploy that recreates `api`, `web` or `realtime` leaves this
# process talking to an address nothing is listening on: healthy containers, a healthy
# edge, and 503 on every request until somebody thinks to reload nginx. It is the worst
# shape of failure - the deploy reports success and the site is down.
#
# The fix is two parts, and neither works without the other. `resolver` points at
# Docker's embedded DNS with a short TTL, and the upstream host has to be a *variable*:
# a literal in `proxy_pass` is resolved at load time no matter what resolver is set.
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server_tokens off;
client_max_body_size 30m;
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 60s;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# ssl_stapling is deliberately absent: Let's Encrypt has retired OCSP and no longer
# puts a responder URL in its certificates, so enabling it staples nothing and logs a
# warning from every worker on every start.

# ---------------------------------------------------------------------------
# Anything we were not asked for.
#
# Without this block the FIRST https server below is nginx's default, so a request
# to the bare IP address, to a stale DNS name, or from a scanner sending any Host
# at all is answered by the dashboard. That is how a deployment ends up indexed
# under a hostname nobody meant to serve, and how a scanner learns what is here.
#
# 444 closes the connection without a response. It needs a certificate to reach
# that point at all - any of the four will do, since the name will not match and
# the client is being hung up on regardless.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    return 444;
}

# ---------------------------------------------------------------------------
# Plain HTTP: the ACME challenge, and a redirect. Nothing else.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www, which exists only to send people to the real thing.
#
# One canonical hostname, not two that both work: two origins means cookies,
# CORS, CSP and every absolute URL in an email have to agree about which is
# "the" site, and sooner or later one of them does not.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${APP_HOST};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 301 https://${APP_HOST}$request_uri;
}

# ---------------------------------------------------------------------------
# The dashboard, the marketing site and the public help centre.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${APP_HOST};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    # Two years, preloadable. Only set here and on the API: a mistake on a hostname
    # that later needs plain HTTP is not undoable from the server side.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    limit_conn conns 64;

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# The API.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_HOST};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_conn conns 128;

    # The errors nginx answers by itself, in the shape the API answers everything else.
    #
    # A body too large, a rate limit tripped, an upstream that is restarting - nginx
    # handles all three without the API ever seeing them, and its default answer is an
    # HTML page. A client written against this API parses that as garbage and has
    # nothing to show a person. These say the same thing in the same envelope.
    error_page 400 = @bad_request;
    error_page 413 = @too_large;
    error_page 429 = @slow_down;
    error_page 414 431 = @bad_request;
    error_page 500 502 503 504 = @upstream_down;

    location @bad_request {
        default_type application/json;
        return 400 '{"success":false,"error":{"code":"MALFORMED_REQUEST","message":"The request could not be understood"}}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request payload is too large"}}';
    }
    location @slow_down {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests. Please slow down."}}';
    }
    location @upstream_down {
        default_type application/json;
        return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable"}}';
    }

    # Sign-in and registration get their own, far stricter bucket. The application
    # throttles these too, per account; this one is per IP and needs no state.
    location ~ ^/api/v1/(auth/login|auth/register|auth/forgot-password|platform/auth/login)$ {
        limit_req zone=api_auth burst=5 nodelay;
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_general burst=60 nodelay;
        set $upstream_api api:3001;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Never exposed publicly. The health endpoints are for the orchestrator, and
    # "which of your dependencies is down" is not a question strangers get to ask.
    location ~ ^/(health|ready|metrics)$ {
        deny all;
        return 404;
    }
}

# ---------------------------------------------------------------------------
# The realtime gateway.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${WS_HOST};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # A chat socket is idle far more often than it is busy. The default 60s read
    # timeout would drop every conversation in which nobody typed for a minute.
    location / {
        set $upstream_realtime realtime:3002;
        proxy_pass http://$upstream_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# The widget: loader.js and the panel, on their own origin.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${CDN_HOST};

    ssl_certificate     /etc/letsencrypt/live/${APP_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_HOST}/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        set $upstream_widget widget:80;
        proxy_pass http://$upstream_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
