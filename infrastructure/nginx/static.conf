server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the server version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The loader is a permanent URL that customers paste into their sites. It must be cacheable
    # but short-lived, so a fix reaches every installed site within minutes.
    location ~* ^/v1/loader\.js$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Everything else is content-hashed, so it can be cached forever.
    location ~* \.(js|css|woff2|png|svg|jpg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
