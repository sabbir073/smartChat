# =============================================================================
# The edge's main configuration. The image's own file, plus one thing it lacks: a `stream`
# context. Port 443 is answered there (stream.conf) and handed to the HTTPS servers in
# edge.conf over the loopback, so that one port can also carry the media server's TURN relay
# over TLS for the networks that block everything else. Everything else is the stock file.
# =============================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rendered from infrastructure/nginx/edge.conf by the image's entrypoint (envsubst).
    include /etc/nginx/conf.d/edge.conf;
}

stream {
    # Rendered from infrastructure/nginx/stream.conf the same way. Named rather than globbed:
    # both land in conf.d, and each belongs to exactly one context.
    include /etc/nginx/conf.d/stream.conf;
}
