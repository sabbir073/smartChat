server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The loader is a permanent URL pasted into customers' sites. It must be cacheable, but only
    # briefly: a fix has to reach every installed site within minutes, not on their next deploy.
    location = /v1/loader.js {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # The panel document. Never cached, so a new bundle is picked up on the next open.
    location = /panel/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        # It is meant to be framed - by the loader, on any customer domain - so no X-Frame-Options
        # here. The panel itself pins the origin it will talk to.
        #
        # The panel renders text three untrusted parties can influence: the visitor, the agent, and
        # the customer whose page is hosting it. React escapes it, and this is what holds if that
        # ever fails. The bundle is a Vite build with no inline scripts, so script-src needs no
        # nonce - 'self' is the whole allow-list, and the API and gateway origins are substituted
        # at container start by the same entrypoint that points the bundle at them.
        add_header Content-Security-Policy "__SMARTCHAT_PANEL_CSP__" always;
        try_files /panel/index.html =404;
    }

    # Panel assets are content-hashed, so they can be cached indefinitely.
    location /panel/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ =404;
    }
}
