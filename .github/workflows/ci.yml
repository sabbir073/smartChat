name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  integration:
    # Named for what it does. Tenant isolation is asserted by scripts/e2e-isolation.mjs, which
    # needs the full stack and therefore runs in the `stack` job below - a job name is a claim,
    # and this one used to make a claim no step in it kept.
    name: Migrations · Schema drift · Seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartchat
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smartchat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartchat"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://smartchat:ci_password@localhost:5432/smartchat_test?schema=public
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=ci_password psql -h localhost -U smartchat -d smartchat_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gin;'

      - name: Apply migrations from an empty database
        run: pnpm db:deploy

      # A migration that only ever runs against a database that already has the previous
      # schema is a migration nobody has tested. This applies every one of them in order to
      # an empty database, which is what a new deployment actually does.
      - name: The schema Prisma expects is the schema the migrations produce
        run: pnpm --filter @smartchat/database exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed
        run: pnpm db:seed

      # NOTE: the end-to-end suites in scripts/ need the full Docker stack - the API, the
      # gateway, the worker, MinIO and Mailpit - and are run by the `stack` job below.

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose configuration
        env:
          # The production overlay requires these; `config` fails without them, which is the
          # point - a deployment that forgot a hostname should not start with a placeholder.
          APP_HOST: app.example.com
          API_HOST: api.example.com
          WS_HOST: ws.example.com
          CDN_HOST: cdn.example.com
          CERTBOT_EMAIL: ops@example.com
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
      - name: Build images
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build --pull

  stack:
    name: End to end · The whole stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
          # Compose reports "healthy" from each service's own healthcheck; this waits for the
          # two that everything else depends on rather than sleeping a guessed number of
          # seconds and hoping.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready > /dev/null \
               && curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "stack is ready"; break
            fi
            sleep 5
          done

      - name: Seed
        run: docker compose exec -T -w /app/packages/database api ./node_modules/.bin/tsx prisma/seed.ts

      - name: End-to-end suites
        run: |
          set -e
          for suite in realtime team automation files kb tickets reports integrations platform retention isolation abuse; do
            echo "::group::$suite"
            node scripts/e2e-$suite.mjs
            echo "::endgroup::"
          done

      # The exit criterion of phase 13, run on every change: a backup that has never been
      # restored is not considered reliable, and "never" includes "not since that migration".
      - name: Restore rehearsal
        run: node scripts/restore-rehearsal.mjs

      # And the other half of the same question. Migrations are forward-only, so the rollback
      # procedure is "previous image, plus the pre-deploy backup if the migration was
      # destructive" - which is only true if somebody keeps checking that it is.
      - name: Rollback rehearsal
        run: node scripts/rollback-rehearsal.mjs

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
